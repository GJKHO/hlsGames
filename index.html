  <link rel="icon" href="favicon.8de18.ico"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    #tg-ad-layer {
      position: fixed;
      bottom: 16px;
      left: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      pointer-events: none;
    }
    #tg-reward-btn {
      pointer-events: auto;
      font-size: 15px;
      padding: 10px 18px;
      background: linear-gradient(135deg, #00b4d8, #0096c7);
      color: #fff;
      border: none;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.5);
      cursor: pointer;
      display: none;
    }
    #tg-reward-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #tg-score-toast {
      pointer-events: none;
      font-size: 20px;
      font-weight: bold;
      color: #FFD700;
      text-shadow: 0 0 8px #000;
      display: none;
      animation: floatUp 1.2s ease forwards;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-60px); }
    }
  </style>
</head>
<body>
  <canvas id="GameCanvas" oncontextmenu="event.preventDefault()" tabindex="0"></canvas>
  <div id="splash">
    <div class="progress-bar stripes">
      <span style="width: 0%"></span>
    </div>
  </div>

<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script src="src/settings.0f177.js" charset="utf-8"></script>

<script src="main.52955.js" charset="utf-8"></script>

<script type="text/javascript">
(function () {
    // open web debugger console
    if (typeof VConsole !== 'undefined') {
        window.vConsole = new VConsole();
    }

    var debug = window._CCSettings.debug;
    var splash = document.getElementById('splash');
    splash.style.display = 'block';

    function loadScript (moduleName, cb) {
      function scriptLoaded () {
          document.body.removeChild(domScript);
          domScript.removeEventListener('load', scriptLoaded, false);
          cb && cb();
      };
      var domScript = document.createElement('script');
      domScript.async = true;
      domScript.src = moduleName;
      domScript.addEventListener('load', scriptLoaded, false);
      document.body.appendChild(domScript);
    }

    loadScript(debug ? 'cocos2d-js.js' : 'cocos2d-js-min.f1704.js', function () {
      if (CC_PHYSICS_BUILTIN || CC_PHYSICS_CANNON) {
        loadScript(debug ? 'physics.js' : 'physics-min.7f489.js', window.boot);
      }
      else {
        window.boot();
      }
    });
})();
</script>

<!-- Adsgram 广告层 -->
<div id="tg-ad-layer">
  <div id="tg-score-toast">+200分</div>
  <button id="tg-reward-btn" onclick="tgShowRewardAd()">📺 看广告 +200分</button>
</div>

<script>
(function () {
    window.Telegram && window.Telegram.WebApp && (
        window.Telegram.WebApp.ready(),
        window.Telegram.WebApp.expand()
    );

    var AdController = null;
    var IntAdController = null;

    // 从 ID.txt 读取广告 Block ID，格式：KEY=VALUE，每行一条
    function loadConfig(cb) {
        fetch('ID.txt?_=' + Date.now())
            .then(function (r) { return r.text(); })
            .then(function (text) {
                var cfg = {};
                text.split('\n').forEach(function (line) {
                    var parts = line.trim().split('=');
                    if (parts.length === 2) cfg[parts[0].trim()] = parts[1].trim();
                });
                cb(cfg);
            })
            .catch(function () { cb({}); });
    }

    function initAds(cfg) {
        if (!window.Adsgram) return;
        var rewardId = cfg['REWARD_BLOCK_ID'] || '';
        var intId    = cfg['INT_BLOCK_ID']    || '';
        try { if (rewardId) AdController    = window.Adsgram.init({ blockId: rewardId }); } catch(e) {}
        try { if (intId)    IntAdController = window.Adsgram.init({ blockId: intId });    } catch(e) {}

        document.getElementById('tg-reward-btn').style.display = 'block';
        startIntAdTimer();
    }

    function waitAndInit(cfg) {
        if (window.Adsgram) {
            initAds(cfg);
        } else {
            var sdkCheck = setInterval(function () {
                if (window.Adsgram) { clearInterval(sdkCheck); initAds(cfg); }
            }, 300);
        }
    }

    // 先读配置，再初始化广告
    loadConfig(function (cfg) {
        waitAndInit(cfg);
    });

    // 激励广告：看完 +200分
    window.tgShowRewardAd = function () {
        if (!AdController) return;
        var btn = document.getElementById('tg-reward-btn');
        btn.disabled = true;
        AdController.show().then(function () {
            // 通知游戏加分（Cocos 脚本可覆盖此函数）
            if (typeof window.onAdsgramReward === 'function') {
                window.onAdsgramReward(200);
            }
            // 浮动提示
            var toast = document.getElementById('tg-score-toast');
            toast.style.display = 'block';
            toast.style.animation = 'none';
            setTimeout(function () {
                toast.style.animation = 'floatUp 1.2s ease forwards';
                setTimeout(function () { toast.style.display = 'none'; }, 1200);
            }, 20);
            // 60秒冷却
            var cd = 60;
            btn.textContent = '⏳ ' + cd + 's';
            var cdTimer = setInterval(function () {
                cd--;
                if (cd <= 0) {
                    clearInterval(cdTimer);
                    btn.disabled = false;
                    btn.textContent = '📺 看广告 +200分';
                } else {
                    btn.textContent = '⏳ ' + cd + 's';
                }
            }, 1000);
        }).catch(function () {
            btn.disabled = false;
        });
    };

    // 插屏广告：每30秒自动弹出
    var intAdInterval = null;
    function startIntAdTimer() {
        intAdInterval = setInterval(function () {
            if (!IntAdController) return;
            IntAdController.show().then(function () {}).catch(function () {});
        }, 30000);
    }
})();
</script>
</body>
</html>
